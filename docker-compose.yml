version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finally-app
    ports:
      - "8000:8000"
    volumes:
      - finally-data:/app/db
    env_file:
      - .env
    environment:
      - FINALLY_DB_DIR=/app/db
    restart: unless-stopped

volumes:
  finally-data:
